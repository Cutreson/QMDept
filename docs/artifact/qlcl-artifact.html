<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Quản lý công việc phòng QLCL&amp;BD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Ứng dụng dạng điện thoại: chọn vai trò ở trên, thanh tab ở dưới — Nhân viên (6 bước), Leader (4 màn), Trưởng phòng (4 màn). */
:root{
  --bg:#eef2f8; --surface:#ffffff; --surface-2:#f1f4fa; --line:#dde3ee; --fg:#141a2b; --muted:#5d677d; --faint:#8a93a8;
  --brand:#1747d6; --brand-soft:#e5ecff; --leader:#1747d6; --tp:#6a3fd1; --tp-soft:#efe8ff;
  --ok:#14864b; --ok-soft:#dff3e7; --warn:#b26a00; --warn-soft:#fff1d6; --bad:#c62828; --bad-soft:#fde4e4; --idle:#59627a; --idle-soft:#eceff5;
  --plan:#b9c3d6;
  --font:"Be Vietnam Pro",system-ui,"Segoe UI",Roboto,Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1120; --surface:#161c2e; --surface-2:#1d2439; --line:#2a3249; --fg:#e8ecf6; --muted:#a3acc2; --faint:#7a839b;
  --brand:#6b8fff; --brand-soft:#1f2a4d; --tp:#a687ff; --tp-soft:#2a2147;
  --ok:#4bc785; --ok-soft:#173726; --warn:#f0b23a; --warn-soft:#3a2d12; --bad:#ff6b6b; --bad-soft:#3d1a1d; --idle:#a3acc2; --idle-soft:#242c42; --plan:#3d4762; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1120; --surface:#161c2e; --surface-2:#1d2439; --line:#2a3249; --fg:#e8ecf6; --muted:#a3acc2; --faint:#7a839b;
  --brand:#6b8fff; --brand-soft:#1f2a4d; --tp:#a687ff; --tp-soft:#2a2147;
  --ok:#4bc785; --ok-soft:#173726; --warn:#f0b23a; --warn-soft:#3a2d12; --bad:#ff6b6b; --bad-soft:#3d1a1d; --idle:#a3acc2; --idle-soft:#242c42; --plan:#3d4762; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.shell{max-width:620px;margin:0 auto;padding-inline:16px}

/* thanh trên */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .shell{padding-block:8px;display:grid;gap:8px}
.top-row{display:flex;align-items:center;gap:10px}
.logo{font-weight:800;letter-spacing:.14em;font-size:19px;color:var(--brand);line-height:1}
.logo small{display:block;font-size:9.5px;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-top:2px}
.me{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.me select{max-width:170px}
.av{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--brand-soft);color:var(--brand)}
.av.tp{background:var(--tp-soft);color:var(--tp)}
.roles{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:10px;padding:3px}
.roles button{border:0;background:none;border-radius:8px;padding:6px 4px;font-weight:600;font-size:13px;color:var(--muted)}
.roles button[aria-pressed="true"]{background:var(--rc,var(--brand));color:#fff}
.sync{font-size:11px;color:var(--faint);white-space:nowrap}
.sync b{color:var(--ok)}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .shell{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding-inline:4px}
.tabbar button{border:0;background:none;padding:8px 2px 9px;font-size:11px;font-weight:600;color:var(--muted);display:grid;justify-items:center;gap:3px;position:relative}
.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:999px;font-size:10px;min-width:16px;height:16px;padding:0 4px;display:grid;place-items:center}

/* tiêu đề màn hình & thanh ngày */
.head{display:flex;align-items:center;gap:8px;margin:16px 0 10px}
.head h1{font-size:19px;margin:0;line-height:1.25;text-wrap:balance}
.head .sub{font-size:12px;color:var(--muted);font-weight:500}
.step-n{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;background:var(--accent)}
.daybar{display:flex;align-items:center;justify-content:center;gap:6px;margin:0 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.daybar .date{font-weight:700;font-variant-numeric:tabular-nums;flex:1;text-align:center}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:32px;height:32px;display:grid;place-items:center;font-weight:700;padding:0 8px}
.link{background:none;border:0;color:var(--accent,var(--brand));font-weight:600;padding:0}
.back{border:0;background:none;font-size:22px;line-height:1;padding:2px 6px 2px 0;color:var(--fg)}
.chip-sample{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:2px 8px;white-space:nowrap}

/* thành phần chung */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.sec{padding:14px;margin-bottom:12px}
.sec>h2,.h2{font-size:13px;margin:0 0 10px;display:flex;align-items:center;gap:8px;text-transform:uppercase;letter-spacing:.03em;color:var(--accent,var(--brand));font-weight:800}
.h2 .grow,.sec>h2 .grow{flex:1}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.kpis.k4{grid-template-columns:repeat(4,1fr)}
.kpi{border-radius:10px;padding:8px 4px;background:var(--kbg);color:var(--kfg);text-align:center}
.kpi b{display:block;font-size:20px;font-family:var(--mono);line-height:1.15}
.kpi span{font-size:11px;font-weight:600}
.k-info{--kbg:var(--brand-soft);--kfg:var(--brand)} .k-ok{--kbg:var(--ok-soft);--kfg:var(--ok)} .k-warn{--kbg:var(--warn-soft);--kfg:var(--warn)}
.k-bad{--kbg:var(--bad-soft);--kfg:var(--bad)} .k-idle{--kbg:var(--idle-soft);--kfg:var(--idle)} .k-tp{--kbg:var(--tp-soft);--kfg:var(--tp)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 8px;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)}
.p-idle{background:var(--idle-soft);color:var(--idle)} .p-info{background:var(--brand-soft);color:var(--brand)} .p-solid-bad{background:var(--bad);color:#fff}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;font-weight:600;color:var(--muted);text-align:left;padding:7px 6px;background:var(--surface-2);white-space:nowrap}
td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:center;font-family:var(--mono);font-variant-numeric:tabular-nums}
.red{color:var(--bad);font-weight:700} .green{color:var(--ok);font-weight:700}
.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;background:var(--surface);margin-bottom:12px}
.subtabs{display:flex;border-bottom:1px solid var(--line);margin:0 0 12px;overflow-x:auto}
.subtabs button{flex:1;background:none;border:0;padding:9px 10px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:10px;padding:3px;margin:0 0 12px}
.seg button{border:0;background:none;border-radius:8px;padding:7px 4px;font-weight:600;color:var(--muted);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.seg .cnt{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;margin-left:4px;padding:0 4px}
.btn{border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:8px 13px;font-weight:600}
.btn-primary{background:var(--accent,var(--brand));border-color:var(--accent,var(--brand));color:#fff}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-no{color:var(--bad);border-color:var(--bad);background:var(--surface)}
.btn-ghost{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-block{width:100%;padding:12px;font-size:15px}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row>.btn{flex:1}
label.f{display:block;font-size:12.5px;font-weight:600;margin:10px 0 5px}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px}
textarea.in{min-height:64px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pick2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:10px}
.pick2 select.in{min-height:42px;font-weight:600}
select.in.ph{color:var(--faint);font-weight:500}
select.in option{color:var(--fg);background:var(--surface);font-weight:500}
.kv2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv2 .note{margin-bottom:3px}
@media (max-width:360px){ .pick2{grid-template-columns:1fr} }
.pick2.eq{grid-template-columns:1fr 1fr}
.segr.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.mgrid .mg-sub{font-size:9.5px;color:var(--muted);line-height:1;white-space:nowrap}
.tm-wrap{overflow-x:auto;margin:0 -14px;padding:0 14px 4px}
table.tm{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12px}
table.tm th,table.tm td{padding:0;border-top:1px solid var(--line);text-align:center;background:var(--surface)}
table.tm thead th{background:var(--surface-2);border-top:0}
table.tm thead th button{background:none;border:0;padding:4px 0;width:30px;line-height:1.15;font-size:10.5px;font-weight:600;color:var(--muted)}
table.tm th.sun button{color:var(--bad)}
table.tm .tm-name{position:sticky;left:0;z-index:1;text-align:left;padding:4px 10px 4px 0;white-space:nowrap;min-width:130px;font-size:12.5px}
table.tm thead .tm-name{background:var(--surface-2);padding-left:6px;color:var(--muted);font-weight:600}
.tm-name button{background:none;border:0;padding:0;font-weight:600;color:var(--fg)}
tr.cur .tm-name button{color:var(--brand)}
.tm-c button{width:26px;height:26px;margin:2px;border:0;border-radius:6px;background:none;font-family:var(--mono);font-weight:700;font-size:12px;position:relative;color:var(--faint)}
.tm-c.todo button{background:var(--brand-soft);color:var(--brand)}
.tm-c.done button{background:var(--ok-soft);color:var(--ok)}
.tm-c.late button{background:var(--bad-soft);color:var(--bad)}
.tm-c.lv button{background:var(--idle-soft);color:var(--idle)}
.tm-c.sel button{outline:2px solid var(--brand);outline-offset:-2px}
table.tm .selcol{background:color-mix(in srgb,var(--brand) 9%,var(--surface))}
table.tm thead th.selcol{background:color-mix(in srgb,var(--brand) 16%,var(--surface-2))}
table.tm td.tot,table.tm th.tot{padding:0 8px;font-weight:700;color:var(--muted)}
table.tm tr.sum td,table.tm tr.sum th{font-size:11.5px;color:var(--muted);font-weight:700;padding-top:4px;padding-bottom:4px}
.otdot{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--tp)}
.tmd{padding:8px 12px;border-top:1px solid var(--line)} .tmd:first-of-type{border-top:0}
.tmd.cur{background:color-mix(in srgb,var(--brand) 5%,var(--surface))}
.tmd .trow{padding-left:0;padding-right:0}
.p-tp{background:var(--tp-soft);color:var(--tp)}
.acc b .pill{font-size:10.5px;padding:1px 6px;vertical-align:1px}
.va-info{display:inline-flex;align-items:center;gap:6px}
.asg{padding:10px 0;border-top:1px solid var(--line)} .asg:first-of-type{border-top:0;padding-top:0}
.asg .trow{padding:7px 0 7px 4px}
.acc{display:grid;min-width:0;text-align:right;line-height:1.25}
.acc b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc small{font-size:11px;color:var(--muted)}
.va .in{padding:5px 30px 5px 8px;width:auto;max-width:220px}
.top .shell .me{flex:1;justify-content:flex-end}
.btn[hidden],button[hidden]{display:none!important}
.login{max-width:420px;margin:28px auto}
.optbox{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.optbox label.trow:has(input:checked){background:var(--brand-soft)}
.otl{margin:0;padding-left:18px}
.nx{margin-top:12px;padding:12px;border-radius:12px;background:var(--surface-2)}
.nx-h{font-weight:700;color:var(--accent,var(--brand))}
.nx-line{font-size:12.5px;margin:-4px 0 8px;padding:6px 8px;border-radius:8px;background:var(--brand-soft)}
.kvl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13px;margin:0}
.kvl dt{color:var(--muted)} .kvl dd{margin:0}
.segr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;background:var(--surface-2);border-radius:10px;padding:3px}
.segr label{position:relative;display:block}
.segr input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.segr span{display:block;text-align:center;border-radius:8px;padding:10px 4px;font-weight:600;font-size:13.5px;color:var(--muted)}
.segr input:checked+span{background:var(--brand);color:#fff}
.segr input:focus-visible+span{outline:2px solid var(--brand);outline-offset:2px}
.lv-sum{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13px}
.lv-sum b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lv-sum.err{background:var(--bad-soft);color:var(--bad)}
.lv-box{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--warn-soft)}
.lv-box>div{flex:1;min-width:0}
.lv-t{font-weight:700;color:var(--warn)}
.lv-miss{background:var(--bad-soft)} .lv-miss .lv-t{color:var(--bad)}
.lv-line{margin-top:10px;font-size:13px}
.warn-t{color:var(--warn);font-weight:600}
.pmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:12.5px;margin:0 0 10px}
.note{font-size:12px;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100% - 32px);pointer-events:none}
.notice{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:12px;margin-bottom:12px;background:var(--nbg,var(--ok-soft));color:var(--fg)}
.notice .ic{width:26px;height:26px;flex:none;border-radius:50%;background:var(--nfg,var(--ok));color:#fff;display:grid;place-items:center;font-weight:800}
.notice b{color:var(--nfg,var(--ok))}

/* thẻ dự án */
.plist{display:grid;gap:10px;margin-bottom:12px}
.pcard{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;text-align:left;padding:12px;width:100%}
.pcard:hover{border-color:var(--accent)}
.ptile{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;background:var(--tc)}
.pcard .t{display:flex;justify-content:space-between;gap:8px;align-items:start}
.pcard b{font-size:15px}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;flex:1}
.bar span{display:block;height:100%;background:var(--bc,var(--ok));border-radius:4px}
.barrow{display:flex;align-items:center;gap:8px;margin:5px 0 2px}
.barrow .mono{font-size:12px;width:36px;text-align:right}
.chev{color:var(--faint);font-size:20px}

/* danh sách bước kế hoạch */
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps:before{content:"";position:absolute;left:10px;top:12px;bottom:12px;border-left:2px solid var(--line)}
.steps li{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:7px 0;position:relative}
.steps .node{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:var(--surface);border:2px solid var(--nc,var(--line));z-index:1;margin-top:1px}
.steps .done .node{background:var(--ok);border-color:var(--ok)}
.steps .cur .node{border-color:var(--warn);box-shadow:inset 0 0 0 4px var(--surface);background:var(--warn)}
.steps .h{display:flex;justify-content:space-between;gap:8px;align-items:start}
.steps .title{font-weight:600}
.steps .done .title{color:var(--muted)}
.steps .meta{font-size:12px;color:var(--muted)}
.steps .num{font-family:var(--mono);color:var(--faint);margin-right:4px}

/* biểu đồ cột */
.cols{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:20px;border-bottom:1px solid var(--line)}
.col{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;height:100%;min-width:0}
.col .c{width:min(30px,42%);border-radius:5px 5px 0 0;background:var(--cc,var(--brand));position:relative;min-height:2px}
.col .c i{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-style:normal;font-family:var(--mono);font-size:11px;font-weight:600;white-space:nowrap;padding-bottom:2px;color:var(--fg)}
.col-lbl{display:flex;gap:10px}
.col-lbl div{flex:1;text-align:center;font-size:11px;color:var(--muted);padding-top:5px;min-width:0;line-height:1.3}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* donut */
.donut-wrap{display:flex;gap:18px;align-items:center}
.donut{width:120px;height:120px;flex:none;border-radius:50%;display:grid;place-content:center;text-align:center;background:radial-gradient(closest-side,var(--surface) 70%,transparent 71%),var(--g)}
.donut b{font-family:var(--mono);font-size:24px;line-height:1}
.donut span{font-size:11px;color:var(--muted)}
.dl{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:13px;flex:1}
.dl li{display:flex;align-items:center;gap:8px}
.dl i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.dl b{font-family:var(--mono);margin-right:2px}

/* kế hoạch tuần */
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px;text-align:center}
.wstrip button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0;display:grid;gap:3px;justify-items:center}
.wstrip small{font-size:11px;color:var(--muted);font-weight:600}
.wstrip .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--mono);background:var(--dbg,var(--surface-2));color:var(--dfg,var(--muted))}
.wstrip .today{border-color:var(--accent)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px;text-align:center}
.mgrid .dow{font-size:11px;color:var(--muted);font-weight:600;padding:2px 0}
.mgrid button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 0;display:grid;gap:2px;justify-items:center;min-width:0}
.mgrid small{font-size:11px;color:var(--muted);font-weight:600}
.mgrid .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-family:var(--mono);font-size:12px;background:var(--dbg,var(--surface-2));color:var(--dfg,var(--muted))}
.mgrid .today{border-color:var(--accent)}
.mgrid .sel{border:2px solid var(--brand);background:var(--brand-soft)}
.wday{margin-bottom:12px;overflow:hidden}
.wday>h3{margin:0;padding:8px 12px;font-size:13px;background:var(--brand-soft);color:var(--brand)}
.trow{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.trow:first-of-type{border-top:0}
.ck{width:20px;height:20px;border-radius:5px;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.ck.on{background:var(--ok);border-color:var(--ok)}
.ck.half{border-color:var(--warn)} .ck.bad{border-color:var(--bad)}
.trow .t{font-weight:600;font-size:13.5px}
.trow .s{font-size:12px;color:var(--muted)}
.trow .tm{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
label.trow{cursor:pointer}
label.trow input{width:18px;height:18px;accent-color:var(--brand)}

/* dòng thời gian trong ngày */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl:before{content:"";position:absolute;left:8px;top:16px;bottom:16px;border-left:2px dotted var(--line)}
.tl>li{display:grid;grid-template-columns:18px 1fr;gap:10px;margin-bottom:10px}
.tl .dot{width:18px;height:18px;border-radius:50%;background:var(--nc,var(--idle));margin-top:14px;z-index:1;box-shadow:0 0 0 3px var(--bg);display:grid;place-items:center;color:#fff;font-size:10px;font-weight:800}
.task{padding:12px}
.task .h{display:flex;justify-content:space-between;gap:8px;align-items:start}
.task .t{font-weight:700}
.task .tm{font-family:var(--mono);font-size:13px;margin:2px 0 8px}
.task .src{font-size:11px;font-weight:600;color:var(--tp)}
.detail{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;display:grid;gap:4px}
.photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.photos img{width:84px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--surface-2)}

/* duyệt */
.apv{padding:12px;margin-bottom:12px}
.apv .hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.apv .hd b{flex:1}
.apv table{margin-bottom:10px}
.cmt{font-size:13px;background:var(--surface-2);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.cmt b{font-size:12px}
.issue{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.issue:first-of-type{border-top:0}
.issue .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;background:var(--ic,var(--warn))}
.issue .t{font-weight:700}
.issue .m{font-size:12px;color:var(--muted)}
.prow{display:grid;grid-template-columns:32px 1fr 42px 1fr 18px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
details.prow-d>summary{list-style:none;cursor:pointer}
details.prow-d>summary::-webkit-details-marker{display:none}
details.prow-d[open] .chev{transform:rotate(90deg)}
.pchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.pchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;white-space:nowrap}
.pchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:#fff}

/* hộp thoại kiểu bảng trượt */
.dlg{position:fixed;inset:0;background:rgb(10 14 26 / .5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.dlg>.card{width:100%;max-width:620px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.dlg h3{margin:0 0 4px;font-size:17px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:9px 10px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.choice input{accent-color:var(--cc)}
.choice:has(input:checked){border-color:var(--cc);background:color-mix(in srgb,var(--cc) 12%,var(--surface))}
@media (min-width:700px){ .dlg{align-items:center} .dlg>.card{border-radius:18px} }
@media (max-width:440px){ .kpis{grid-template-columns:repeat(3,1fr)} .kpis.k4{grid-template-columns:repeat(2,1fr)} .donut{width:100px;height:100px} .grid2{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
// ================= Danh mục =================
const ROLES = [
  {id:'nv', label:'Nhân viên', c:'var(--brand)'},
  {id:'leader', label:'Leader', c:'var(--brand)'},
  {id:'tp', label:'Trưởng phòng', c:'var(--tp)'},
];
const IC = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  week:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  check:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
  eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  send:'<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  folder:'<path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  doc:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h6"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  plus:'<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M12 8v8M8 12h8"/>',
};
const TABS = {
  nv:[{id:'thang',l:'Kế hoạch tháng',i:'week'},{id:'du_an',l:'Thông tin dự án',i:'home'},{id:'dau_ngay',l:'Báo cáo đầu ngày',i:'sun'},{id:'lam_them',l:'Làm thêm',i:'clock'},{id:'cuoi_ngay',l:'Báo cáo cuối ngày',i:'flag'}],
  leader:[{id:'tong_quan',l:'Tổng quan',i:'home'},{id:'ke_hoach',l:'Kế hoạch & duyệt',i:'check'},{id:'theo_doi',l:'Theo dõi',i:'eye'},{id:'bao_cao',l:'Báo cáo TP',i:'send'},{id:'lam_them',l:'Làm thêm',i:'clock'}],
  tp:[{id:'tong_quan',l:'Tổng quan',i:'grid'},{id:'phe_duyet',l:'Phê duyệt',i:'check'},{id:'du_an',l:'Dự án',i:'folder'},{id:'bao_cao',l:'Báo cáo',i:'doc'},{id:'lam_them',l:'Làm thêm',i:'clock'}],
};
const TS = {hoan_thanh:['Hoàn thành','p-ok','var(--ok)'], dang_lam:['Đang làm','p-warn','var(--warn)'], cham:['Chậm','p-bad','var(--bad)'], chua_lam:['Chưa làm','p-idle','var(--idle)']};
const PS = {dat:['Đạt','p-ok','var(--ok)'], dang_lam:['Đang làm','p-warn','var(--warn)'], cham:['Chậm','p-bad','var(--bad)'], nguy_co:['Nguy cơ','p-solid-bad','var(--bad)'], hoan_thanh:['Hoàn thành','p-info','var(--brand)']};
const AP = {chua_gui:['Chưa gửi','p-idle'], cho_duyet:['Chờ duyệt','p-warn'], cho_tp:['Chờ TP duyệt','p-info'], da_duyet:['Đã duyệt','p-ok'], tu_choi:['Từ chối','p-bad']};
const XS = {cho_duyet:['Chờ duyệt','p-warn','var(--warn)'], da_duyet:['Đã duyệt','p-ok','var(--ok)'], dang_xu_ly:['Đang xử lý','p-info','var(--brand)'], xong:['Hoàn thành','p-ok','var(--ok)'], tu_choi:['Từ chối','p-bad','var(--bad)']};
const SRC = {ngoai_ke_hoach:'Ngoài kế hoạch', phat_sinh:'Phát sinh', chuyen_tiep:'Chuyển tiếp', giao_viec:'Leader giao'};
// Việc chỉ hiện trên lịch tháng khi đã được Leader duyệt.
function okCal(t){
  if(t.source==='ngoai_ke_hoach'){ const p=planOf(t.date,t.employee); return p?.leaderSt==='ok' && (p.taskIds||[]).includes(t.id); }
  if(t.source==='chuyen_tiep'){ return t.carryOk===true; }
  return true;
}
const REASON={cham:'Lý do chưa hoàn thành', chua_lam:'Lý do chưa hoàn thành', dang_lam:'Lý do chưa hoàn thành'};
function nextWDs(d, n){ return [...Array(n)].map((_,k)=>addDay(d,k+1)) }
const WD = ['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
const WDS = ['CN','T2','T3','T4','T5','T6','T7'];
const TILE = ['#1747d6','#0f7a6b','#c2410c','#6a3fd1','#0e7490','#b91c1c','#4d7c0f'];
const COLS = ['people','prj','items','tasks','dayPlans','extras','dayReports','leaves','needs','leaderReports','ot','otSends','assign'];
// Cấp bậc nhân viên và vai trò trong dự án
const LV={tech1:'Tech 1', tech2:'Tech 2', tech3:'Tech 3'};
const AROLE={lead:'Leader dự án', support:'Hỗ trợ dự án'};
function assignsOf(emp){ return S.assign.filter(a=>a.employee===emp && PJ(a.project) && !PJ(a.project).closed) }
function lvPill(p){ return LV[p?.level] ? `<span class="pill p-tp">${LV[p.level]}</span>` : '' }
function teamProjects(){ return [...new Set(S.assign.filter(a=>P(a.employee)?.role==='nv' && inScope(a.employee)).map(a=>a.project))].filter(id=>PJ(id) && !PJ(id).closed) }
function lvOpts(cur){ return `<option value="">— Chưa xếp —</option>${Object.entries(LV).map(([k,l])=>`<option value="${k}" ${cur===k?'selected':''}>${l}</option>`).join('')}` }
// Bảng kế hoạch tháng của nhóm: hàng = nhân viên, cột = ngày trong tháng
function teamMonthTable(ms){
  const ppl=poolFor('nv'); if(!ppl.length) return '<div class="empty">Nhóm chưa có nhân viên.</div>';
  const pre=ms.slice(0,8), n=new Date(Date.UTC(+ms.slice(0,4),+ms.slice(5,7),0)).getUTCDate(), days=[...Array(n)].map((_,k)=>pre+pad(k+1)), inM=S.date.slice(0,8)===pre;
  const cnt=(e,d)=>tasksOn(d,e).filter(okCal);
  const cell=(e,d)=>{ const t=cnt(e,d), c=counts(t), lv=onLeave(d,e), ot=S.ot.some(x=>x.id===`${d}_${e}` && x.status!=='tu_choi');
    const cls = lv?'lv' : !t.length?'' : c.hoan_thanh===t.length?'done' : c.cham?'late' : 'todo';
    return `<td class="tm-c ${cls} ${d===S.date?'selcol':''} ${e===S.me.nv&&d===S.date?'sel':''}"><button data-act="tmCell" data-e="${e}" data-d="${d}" aria-label="${esc(pname(e))} ${dm(d)}: ${lv?'nghỉ':t.length+' việc'}">${lv?'N':t.length||''}${ot?'<i class="otdot"></i>':''}</button></td>`; };
  return `<section class="card sec"><h2><span class="grow">Bảng kế hoạch tháng ${ms.slice(5,7)}/${ms.slice(0,4)}</span><span class="note" style="text-transform:none">${ppl.length} người</span></h2>
    <div class="legend"><span><i style="background:var(--brand-soft);border:1px solid var(--brand)"></i>Có việc</span><span><i style="background:var(--ok)"></i>Xong hết</span><span><i style="background:var(--bad)"></i>Có việc chậm</span><span><i style="background:var(--idle-soft);border:1px solid var(--idle)"></i>N = nghỉ</span><span><i style="background:var(--tp);border-radius:50%"></i>Làm thêm</span></div>
    <div class="tm-wrap"><table class="tm"><thead><tr><th class="tm-name">Nhân viên</th>${days.map(d=>`<th class="${wday(d)===0?'sun':''} ${d===S.date?'selcol':''}"><button data-act="tmDay" data-d="${d}" aria-label="Cả nhóm ngày ${dm(d)}">${WDS[wday(d)]}<br>${+d.slice(8)}</button></th>`).join('')}<th class="tot">Tổng</th></tr></thead>
    <tbody>${ppl.map(p=>`<tr class="${p.id===S.me.nv?'cur':''}"><th class="tm-name"><button data-act="tmCell" data-e="${p.id}" data-d="${inM?S.date:days[0]}">${esc(p.name)}</button> ${lvPill(p)}</th>${days.map(d=>cell(p.id,d)).join('')}<td class="tot mono">${days.reduce((s,d)=>s+cnt(p.id,d).length,0)}</td></tr>`).join('')}
    <tr class="sum"><th class="tm-name">Cả nhóm</th>${days.map(d=>{ const s=ppl.reduce((a,p)=>a+cnt(p.id,d).length,0); return `<td class="mono ${d===S.date?'selcol':''}">${s||''}</td>`; }).join('')}<td class="tot mono">${days.reduce((a,d)=>a+ppl.reduce((b,p)=>b+cnt(p.id,d).length,0),0)}</td></tr></tbody></table></div>
    <p class="note" style="margin-bottom:0">Số trong ô là số việc đã duyệt của người đó trong ngày. Bấm một ô để xem chi tiết và giao thêm việc bên dưới; bấm tiêu đề ngày để xem cả nhóm.</p></section>`;
}
function teamDayList(d){
  const ppl=poolFor('nv');
  return `<section class="card wday"><h3>Công việc cả nhóm · ${WD[wday(d)]} ${dm(d)}</h3>${ppl.map(p=>{ const t=tasksOn(d,p.id).filter(okCal), lv=onLeave(d,p.id), ot=S.ot.find(x=>x.id===`${d}_${p.id}` && x.status!=='tu_choi');
    return `<div class="tmd ${p.id===S.me.nv?'cur':''}"><div class="tmd-h"><button class="link" data-act="tmCell" data-e="${p.id}" data-d="${d}" style="color:var(--fg)">${esc(p.name)}</button> ${lvPill(p)} <span class="note">${lv?'<b class="red">Nghỉ</b> · ':''}${t.length} việc${ot?` · Làm thêm ${esc(ot.start)}–${esc(ot.end)}`:''}</span></div>${t.map(x=>taskRow(x)).join('')}</div>`; }).join('')}</section>`;
}
// Giao thêm việc ngay trên lịch nhân viên (Leader / Trưởng phòng xem lịch)
function calAssignForm(d, me){
  const ppl=poolFor('nv'), pj0=mainProject(me,d)||activePj()[0]?.id||'';
  return `<form id="calAssignForm" class="card sec ro-ok"><h2>Giao thêm việc · ${WD[wday(d)]} ${dm(d)}</h2>
    <div class="grid2"><div><label class="f" for="gpP" style="margin-top:0">Dự án</label><select class="in" id="gpP" data-ch="fieldPj" data-px="gp">${activePj().map(p=>`<option value="${p.id}" ${p.id===pj0?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
    <div><label class="f" for="gpI" style="margin-top:0">Đầu mục kế hoạch</label><select class="in" id="gpI"><option value="">— Việc khác (tự nhập) —</option>${itemsOf(pj0).map(i=>`<option value="${i.id}">${esc(i.title)}</option>`).join('')}</select></div></div>
    <label class="f" for="gpT">Nội dung công việc <span class="note">(để trống nếu dùng tên đầu mục)</span></label><input class="in" id="gpT" placeholder="VD: Check I/O khu vực trục X">
    <div class="pick2 eq"><div><label class="f" for="gpS">Bắt đầu</label>${timeSel('gpS','08:00')}</div><div><label class="f" for="gpE">Kết thúc</label>${timeSel('gpE','12:00',true)}</div></div>
    <label class="f">Người tham gia <span class="note">(tích chọn và đặt vai trò trong dự án)</span></label>
    <div class="optbox">${ppl.map(p=>{ const n=tasksOn(d,p.id).filter(okCal).length, lv=onLeave(d,p.id), cur=S.assign.find(a=>a.id===`${pj0}_${p.id}`)?.role;
      return `<div class="trow"><input type="checkbox" id="gpw_${p.id}" name="gpW" value="${p.id}" ${p.id===me?'checked':''}><label for="gpw_${p.id}" style="cursor:pointer;min-width:0"><div class="t">${esc(p.name)} ${lvPill(p)}</div><div class="s">${lv?'<b class="red">Nghỉ</b> · ':''}${n} việc trong ngày</div></label>
        <select class="in" id="gpR_${p.id}" style="padding:5px 26px 5px 8px;width:auto;font-size:12.5px" aria-label="Vai trò của ${esc(p.name)}"><option value="support">Hỗ trợ</option><option value="lead" ${cur==='lead'?'selected':''}>Leader dự án</option></select></div>`; }).join('')}</div>
    <button class="btn btn-primary btn-block" style="margin-top:12px">Giao việc cho người đã chọn</button></form>`;
}
function ldAssign(){
  const list=staff(); if(!list.length) return '<div class="empty">Nhóm chưa có nhân viên. Trưởng phòng xếp nhóm ở tab Nhân sự.</div>';
  const tp=teamProjects(), mine=S.assign.filter(a=>inScope(a.employee) && P(a.employee)?.role==='nv' && PJ(a.project) && !PJ(a.project).closed);
  let h = `<div class="kpis k4"><div class="kpi k-info"><b>${tp.length}</b><span>Dự án nhóm quản lý</span></div><div class="kpi k-tp"><b>${mine.filter(a=>a.role==='lead').length}</b><span>Leader dự án</span></div><div class="kpi k-ok"><b>${mine.filter(a=>a.role!=='lead').length}</b><span>Hỗ trợ dự án</span></div><div class="kpi k-idle"><b>${list.filter(p=>!assignsOf(p.id).length).length}</b><span>Chưa được giao</span></div></div>`;
  const pj0=activePj()[0]?.id||'';
  h = `<form id="assignForm" class="card sec"><h2>Giao việc cho nhân viên</h2>
    <div class="grid2"><div><label class="f" for="gaW" style="margin-top:0">Nhân viên</label><select class="in" id="gaW">${list.map(p=>`<option value="${p.id}">${esc(p.name)}${LV[p.level]?' · '+LV[p.level]:''}</option>`).join('')}</select></div>

function planSt(p){ if(!p) return 'chua_gui'; if(p.leaderSt==='no'||p.tpSt==='no') return 'tu_choi'; if(p.leaderSt==='ok') return needTp(p) && p.tpSt!=='ok' ? 'cho_tp' : 'da_duyet'; return 'cho_duyet' }

function pjPct(pid){ const it=itemsOf(pid); if(!it.length) return 0; return Math.round(it.filter(i=>i.status==='hoan_thanh').length/it.length*100) }

  dr.lvOff=[];
  if(leave) ts.forEach(t=>{ if(t.start>=leave.from && t.end<=leave.to && on(t)){ dr.ck[t.id]=false; dr.lvOff.push(t.id); } });

  else if('mealPrev' in dr){ if(dr.meal==='cat') dr.meal=dr.mealPrev; delete dr.mealPrev; }

}

function pjTable(d){
  const tpj=teamProjects(), ps=S.role==='leader' ? activePj().filter(p=>tpj.includes(p.id)) : activePj(); if(!ps.length) return `<p class="note">${S.role==='leader'?'Nhóm chưa được giao dự án nào. Giao ở Lịch nhân viên → Tất cả nhân viên.':'Chưa có dự án.'}</p>`;

    <p class="note">KH = nhu cầu nhân sự, TT = số người có việc tại dự án trong ngày. Tiến độ = % đầu mục kế hoạch đã xong.</p>`;

function donut(c, total){
  total = total || (c.hoan_thanh+c.dang_lam+c.cham+c.chua_lam);

  const g = total? 'conic-gradient('+seg.map(([k,col])=>{ const a=acc; acc+=c[k]/total*100; return `${col} ${a}% ${acc}%`}).join(',')+')' : 'var(--surface-2)';
  return `<div class="donut-wrap"><div class="donut" style="--g:${g}" role="img" aria-label="${total} công việc"><b>${total}</b><span>công việc</span></div>
    <ul class="dl">${seg.map(([k,col])=>`<li><i style="--c:${col}"></i><b>${c[k]}</b>${TS[k][0]}</li>`).join('')}</ul></div>`;
}
function ldPlan(){

function issuesOf(d){

  activePj().filter(p=>pjStatus(p.id,d)==='nguy_co').forEach(p=>out.push({c:'var(--bad)', t:`${p.name}: nguy cơ trễ tiến độ`, m:`Kế hoạch ${pjPlanPct(p.id,d)}% · thực tế ${pjPct(p.id)}%`, at:''}));

function tpApprove(){
  const f=sub('tpF','pend'), mode=sub('tpAp','plan');
  const plans=S.dayPlans.filter(p=>p.date===S.date), xs=S.extras.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));
  const pPend=plans.filter(p=>planSt(p)==='cho_tp');
  let h = head(2,'Chi tiết & phê duyệt','Duyệt yêu cầu hỗ trợ nhân sự nhóm khác hoặc phòng ban khác; theo dõi phát sinh do Leader duyệt') + seg('tpAp',[['plan','Hỗ trợ nhân sự',pPend.length||''],['ps','Phát sinh']],'plan');
  h += `<label class="row" style="margin-bottom:12px"><span class="note">Trạng thái:</span><select class="in" data-ch="sub" data-k="tpF"><option value="pend" ${f==='pend'?'selected':''}>Chờ duyệt</option><option value="ok" ${f==='ok'?'selected':''}>Đã duyệt</option><option value="no" ${f==='no'?'selected':''}>Từ chối</option><option value="all" ${f==='all'?'selected':''}>Tất cả</option></select></label>`;
  if(mode==='plan'){
    h += dayBar();
    const list=plans.filter(needTp).filter(p=>f==='all'||(f==='pend'?['cho_tp','cho_duyet'].includes(planSt(p)):f==='ok'?planSt(p)==='da_duyet':planSt(p)==='tu_choi'));
    h += list.length? list.map(p=>`<section class="card apv"><div class="hd"><span class="av">${esc(initials(pname(p.employee)))}</span><b>${esc(pname(p.employee))}</b>${pill(AP,planSt(p))}</div>
      <p class="note" style="margin:0 0 8px">Leader: ${p.leaderSt?`${p.leaderSt==='ok'?'đã duyệt':'từ chối'} lúc ${hm(p.leaderAt)}`:'chưa duyệt'}</p>${planMeta(p)}${planTable(p)}
      ${p.note?`<div class="cmt"><b>Nhân viên:</b> ${esc(p.note)}</div>`:''}${p.leaderNote?`<div class="cmt"><b>Leader:</b> ${esc(p.leaderNote)}</div>`:''}${p.tpNote?`<div class="cmt"><b>TP:</b> ${esc(p.tpNote)}</div>`:''}
      ${planSt(p)==='cho_duyet'?'<p class="note" style="margin:0">Đang chờ Leader duyệt trước.</p>':''}${planSt(p)==='cho_tp'?`<div class="btn-row"><button class="btn btn-no" data-act="tpDecide" data-id="${p.id}" data-v="no">Từ chối</button><button class="btn btn-ok" data-act="tpDecide" data-id="${p.id}" data-v="ok">Duyệt</button></div>`:''}</section>`).join('')
      : '<div class="empty">Không có yêu cầu hỗ trợ nhân sự phù hợp bộ lọc.</div>';
  } else {
    const list=xs.filter(x=>f==='all'||(f==='pend'?x.status==='cho_duyet':f==='ok'?x.status==='da_duyet':x.status==='tu_choi'));
    h += list.length? list.map(x=>`<section class="card apv"><div class="hd"><span class="av" style="background:${XS[exSt(x)][2]};color:#fff">!</span><b>${esc(x.title)}</b>${pill(XS,exSt(x))}</div>
      <div style="font-size:13px;display:grid;gap:2px;margin-bottom:10px"><div><span class="muted">Dự án:</span> ${esc(pjName(x.project))}</div><div><span class="muted">Người đề xuất:</span> ${esc(pname(x.employee))}</div>
      <div><span class="muted">Thời gian:</span> <span class="mono">${dmy(x.date)} ${esc(x.start||'')}${x.end?'–'+esc(x.end):''}</span></div>${x.desc?`<div><span class="muted">Mô tả:</span> ${esc(x.desc)}</div>`:''}
      ${x.decidedBy?`<div class="note">${x.status==='tu_choi'?'Từ chối':'Duyệt'} bởi ${esc(x.decidedBy)} lúc ${hm(x.decidedAt)}</div>`:''}${x.reason?`<div class="note red">Lý do: ${esc(x.reason)}</div>`:''}${photoHtml(x.photos)}</div>
      ${x.status==='cho_duyet'?'<p class="note" style="margin:0">Chờ Leader duyệt.</p>':''}</section>`).join('')
      : '<div class="empty">Không có phát sinh phù hợp bộ lọc.</div>';
  }
  return h;
}

function tpReports(){
  const t=sub('tpRep','ngay');
  let h = head(0,'Báo cáo từ Leader','Báo cáo ngày Leader gửi và tổng hợp tuần') + tabs('tpRep',[['ngay','Báo cáo ngày'],['tuan','Báo cáo tuần']],'ngay');
  if(t==='tuan') return h + weekReport();
  const list=S.leaderReports.slice().sort((a,b)=>b.id.localeCompare(a.id));
  if(!list.length) return h + '<div class="empty">Chưa có báo cáo nào được gửi.</div>';
  return h + list.map(r=>{ const s=r.summary||{}; return `<section class="card sec"><h2><span class="grow">${dayLabel(r.date||r.id)}</span><span class="note mono" style="text-transform:none">${esc(r.by||'')} · ${hm(r.sentAt)}</span></h2>
    <div class="kpis k4"><div class="kpi k-info"><b>${s.working??'–'}/${s.staff??'–'}</b><span>Nhân sự</span></div><div class="kpi k-ok"><b>${s.done??'–'}</b><span>Hoàn thành</span></div><div class="kpi k-warn"><b>${s.doing??'–'}</b><span>Đang làm</span></div><div class="kpi k-bad"><b>${s.late??'–'}</b><span>Chậm</span></div></div>
    ${(s.projects||[]).length?`<div class="tbl-wrap"><table><thead><tr><th>Dự án</th><th class="n">Tiến độ</th><th class="n">KH/TT</th><th>Trạng thái</th></tr></thead><tbody>${s.projects.map(p=>`<tr><td>${esc(p.name)}</td><td class="n">${p.pct}%</td><td class="n">${p.kh}/${p.tt}</td><td>${pill(PS,p.st)}</td></tr>`).join('')}</tbody></table></div>`:''}
    ${(s.issues||[]).length?`<div class="h2" style="margin-top:12px">Vấn đề nổi bật</div><ul style="margin:0;padding-left:18px">${s.issues.map(i=>`<li>${esc(i)}</li>`).join('')}</ul>`:''}
    ${(s.tomorrow||[]).length?`<div class="h2" style="margin-top:12px">Nhân sự ngày mai</div><p style="margin:0">${s.tomorrow.map(x=>`${esc(x.name)}: ${x.assigned}/${x.need}${x.assigned<x.need?' <b class="red">thiếu '+(x.need-x.assigned)+'</b>':''}`).join(' · ')}</p>`:''}
    ${r.note?`<div class="cmt" style="margin-top:10px"><b>Ghi chú Leader:</b> ${esc(r.note)}</div>`:''}</section>`}).join('');
}

const dlg=document.getElementById('dlg'); let dlgCancel=null;
function closeDlg(){ if(dlg.hidden) return; dlg.hidden=true; const c=dlgCancel; dlgCancel=null; c?.(); }
function sheet(title, body, okLabel, onOk, okClass='btn-primary', onCancel=null){
  dlgCancel=onCancel;
  dlg.innerHTML=`<form class="card" id="sheetForm" role="dialog" aria-modal="true" aria-labelledby="shT"><h3 id="shT">${title}</h3>${body}
    <div class="btn-row" style="margin-top:14px"><button type="button" class="btn" data-x="close">Hủy</button><button class="btn ${okClass}" id="shOk">${okLabel}</button></div></form>`;
  dlg.hidden=false; dlg.querySelector('input:not([type=radio]):not([type=checkbox]),textarea,select')?.focus();
  dlg.querySelector('[data-x=close]').onclick=closeDlg;
  document.getElementById('sheetForm').onsubmit=async e=>{ e.preventDefault(); const ok=document.getElementById('shOk'); ok.disabled=true; ok.textContent='Đang lưu…';
    try{ await onOk(e.target); dlgCancel=null; dlg.hidden=true; }catch(err){ toast(errMsg(err)); ok.disabled=false; ok.textContent=okLabel; } };
}
dlg.addEventListener('click', e=>{ if(e.target===dlg) closeDlg(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeDlg(); });
function ask(msg, onYes, label='Đồng ý'){ sheet('Xác nhận', `<p style="margin:6px 0 0">${esc(msg)}</p>`, label, onYes, 'btn-no') }
function askText(title, label, val, onOk, required){ sheet(title, `<label class="f" for="atx">${label}</label><textarea class="in" id="atx" ${required?'required':''}>${esc(val||'')}</textarea>`, 'Lưu', async f=>onOk(f.querySelector('#atx').value.trim())) }
function photoField(){ return ASSETS? `<label class="f" for="phF">Ảnh hiện trường (tùy chọn)</label><input class="in" type="file" id="phF" accept="image/*" multiple>` : '' }
async function uploadPhotos(form){
  const files=[...(form.querySelector('#phF')?.files||[])].slice(0,4); const ids=[];
  for(const f of files){ const blob=await shrink(f); const r=await ASSETS.upload(blob); ids.push(r.id); }
  return ids;
}
async function shrink(file){
  try{ const bmp=await createImageBitmap(file); const k=Math.min(1,1600/Math.max(bmp.width,bmp.height)); const c=document.createElement('canvas'); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.82)); }catch{ return file }
}
function openUpdate(t){
  const st=t.status||'chua_lam', it=S.items.find(i=>i.id===t.itemId), cur=t.carriedTo?S.tasks.find(x=>x.id===t.carriedTo):null, nds=nextWDs(t.date,14), ndDef=cur?.date||nds.find(x=>wday(x)!==0);
  const nx=`<div id="nxWrap" class="nx"><div class="nx-h">Kế hoạch tiếp theo</div><div class="note">Việc chưa hoàn thành sẽ được chuyển sang ngày bạn chọn.</div>
    <label class="f" for="nxD">Chuyển sang ngày</label><select class="in" id="nxD">${(cur&&!nds.includes(cur.date)?[cur.date,...nds]:nds).map(x=>`<option value="${x}" ${ndDef===x?'selected':''}>${WD[wday(x)]}, ${dmy(x)}${wday(x)===0?' (ngày nghỉ)':''}</option>`).join('')}</select>
    <div class="pick2 eq"><div><label class="f" for="nxS">Bắt đầu</label>${timeSel('nxS',cur?.start||t.start)}</div><div><label class="f" for="nxE">Kết thúc</label>${timeSel('nxE',cur?.end||t.end,true)}</div></div>
    <label class="f" for="nxT">Nội dung tiếp theo</label><input class="in" id="nxT" value="${esc(cur?.title||t.title)}"></div>`;
  sheet('Cập nhật công việc', `<p class="note" style="margin:0 0 8px">${esc(t.title)} · <span class="mono">${esc(t.start)}–${esc(t.end)}</span></p>
    <div class="choices" role="radiogroup" aria-label="Trạng thái">${['dang_lam','hoan_thanh','cham','chua_lam'].map(s=>`<label class="choice" style="--cc:${TS[s][2]}"><input type="radio" name="st" value="${s}" ${st===s?'checked':''}>${TS[s][0]}</label>`).join('')}</div>
    ${it && it.status!=='hoan_thanh'?`<label class="row" style="margin-top:10px;font-size:13px"><input type="checkbox" id="itDone"> Đầu mục “${esc(it.title)}” đã xong toàn bộ</label>`:''}
    ${nx}<label class="f" for="uN" id="uNL">Kết quả / ghi chú</label><textarea class="in" id="uN" placeholder="VD: Tín hiệu ổn định.">${esc(t.note||'')}</textarea>`,
    'Lưu cập nhật', async f=>{
      const s=f.querySelector('input[name=st]:checked')?.value||st, q=id=>f.querySelector('#'+id).value.trim();
      const nd=q('nxD'), ns=q('nxS'), ne=q('nxE'), nt=q('nxT');
      if(s!=='hoan_thanh' && !f.querySelector('#uN').value.trim()) throw new Error('Nhập '+REASON[s].toLowerCase());
      if(s!=='hoan_thanh'){ if(!nt) throw new Error('Nhập nội dung kế hoạch tiếp theo'); if(ne<=ns) throw new Error('Giờ kết thúc phải sau giờ bắt đầu'); }
      const photos=[...(t.photos||[]), ...(ASSETS?await uploadPhotos(f):[])];
      let carry={};
      if(s!=='hoan_thanh'){
        if(cur){ const same=cur.date===nd && cur.start===ns && cur.end===ne && cur.title===nt; if(!same) await DB.doc('tasks/'+cur.id).update({date:nd, start:ns, end:ne, title:nt, carryOk:false, editedBy:null}); carry={carriedTo:cur.id, carryDate:nd}; }
        else { const ref=await DB.collection('tasks').add({date:nd, employee:t.employee, project:t.project, itemId:t.itemId||'', title:nt, start:ns, end:ne, status:'chua_lam', source:'chuyen_tiep', carryOk:false, carriedFrom:t.id, fromDate:t.date, selected:false, note:'', photos:[], createdAt:nowISO()}); carry={carriedTo:ref.id, carryDate:nd}; }
      } else if(cur){ if((cur.status||'chua_lam')==='chua_lam') await DB.doc('tasks/'+cur.id).delete(); carry={carriedTo:null, carryDate:null}; }
      await DB.doc('tasks/'+t.id).update({status:s, note:f.querySelector('#uN').value.trim(), photos, updatedAt:nowISO(), ...carry});
      if(it){ if(s==='hoan_thanh' && f.querySelector('#itDone')?.checked) await DB.doc('items/'+it.id).update({status:'hoan_thanh', doneDate:t.date, doneBy:pname(t.employee)});
        else if((s==='dang_lam'||s==='hoan_thanh'||s==='cham') && (it.status||'chua_lam')==='chua_lam') await DB.doc('items/'+it.id).update({status:'dang_lam'}); }
      toast('Đã cập nhật');
    });
  const nxShow=()=>{ const v=dlg.querySelector('input[name=st]:checked')?.value||st; dlg.querySelector('#nxWrap').hidden = v==='hoan_thanh';
    dlg.querySelector('#uNL').textContent = REASON[v] ? REASON[v]+' (bắt buộc)' : 'Kết quả / ghi chú';
    dlg.querySelector('#uN').placeholder = REASON[v] ? 'VD: Chờ vật tư, khách hàng chưa bàn giao mặt bằng…' : 'VD: Tín hiệu ổn định.'; };
  dlg.querySelectorAll('input[name=st]').forEach(r=>r.addEventListener('change',()=>{ const c=dlg.querySelector('#itDone'); if(c) c.checked = r.value==='hoan_thanh' && r.checked && t.end>='15:00'; nxShow(); }));
  nxShow();
}

      const photos=ASSETS?await uploadPhotos(f):[];

function nowHMs(){ const d=new Date(Date.now()+7*3600e3); return `${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}` }
function myName(){ return pname(S.me[S.role]) }
async function approveExtra(x, role){
  if(x.taskId) return;
  const ref=await DB.collection('tasks').add({date:x.date, employee:x.employee, project:x.project, itemId:'', title:x.title, start:x.start||'08:00', end:x.end||'17:00', status:'chua_lam', source:'phat_sinh', extraId:x.id, selected:true, note:'', photos:[], createdAt:nowISO()});
  await DB.doc('extras/'+x.id).update({status:'da_duyet', taskId:ref.id, decidedBy:myName(), decidedRole:role, decidedAt:nowISO()});
  const plan=planOf(x.date,x.employee); if(plan) await DB.doc('dayPlans/'+plan.id).update({taskIds:[...(plan.taskIds||[]), ref.id]});
}

document.addEventListener('click', async e=>{
  const b=e.target.closest('[data-act]'); if(!b || b.tagName==='SELECT' || b.tagName==='INPUT') return;
  if(isRO() && b.closest('#app') && !NAV_ACTS.has(b.dataset.act)){ toast('Chế độ xem: không sửa được trang của nhân viên'); return; }
  const a=b.dataset.act, id=b.dataset.id;
  try{
  if(a==='role'){ S.role=b.dataset.r; save('role',S.role); S.pj=null; render(); window.scrollTo(0,0); }
  else if(a==='tab'){ S.tab[S.role]=b.dataset.t; S.pj=null; S.editPlan=false; render(); window.scrollTo(0,0); }
  else if(a==='sub'){ S.sub[b.dataset.k]=b.dataset.v; render(); }
  else if(a==='day'){ S.date=addDay(S.date,+b.dataset.d); S.week=null; S.month=null; S.editPlan=false; S.otEdit=false; render(); }
  else if(a==='otEdit'){ S.otEdit=true; render(); }
  else if(a==='eodDecide'){ const r=S.dayReports.find(x=>x.id===id); if(!r) return;
    if(b.dataset.v==='ok') { await DB.doc('dayReports/'+id).update({leaderSt:'ok', leaderBy:myName(), leaderAt:nowISO()});
      for(const n of carriesFrom(r.date).filter(t=>t.employee===r.employee && !t.carryOk)) await DB.doc('tasks/'+n.id).update({carryOk:true, carryBy:myName(), carryAt:nowISO()});
      toast('Đã duyệt báo cáo cuối ngày và kế hoạch chuyển tiếp'); }
    else askText('Yêu cầu '+pname(r.employee)+' bổ sung báo cáo','Nội dung cần bổ sung', r.leaderNote, async v=>{ await DB.doc('dayReports/'+id).update({leaderSt:'no', leaderNote:v, leaderBy:myName(), leaderAt:nowISO()}); toast('Đã gửi yêu cầu bổ sung'); }, true); }
  else if(a==='eodCarry'){ const n=S.tasks.find(x=>x.id===id); if(!n) return; const days=nextWDs(n.fromDate||n.date,14); if(!days.includes(n.date)) days.unshift(n.date);
    sheet('Chỉnh kế hoạch tiếp theo', `<p class="note" style="margin:0 0 8px">${esc(pname(n.employee))} · chuyển tiếp từ ${dm(n.fromDate)}</p>
      <label class="f" for="cD" style="margin-top:0">Chuyển sang ngày</label><select class="in" id="cD">${days.map(x=>`<option value="${x}" ${x===n.date?'selected':''}>${WD[wday(x)]}, ${dmy(x)}${wday(x)===0?' (ngày nghỉ)':''}</option>`).join('')}</select>
      <div class="pick2 eq"><div><label class="f" for="cS">Bắt đầu</label>${timeSel('cS',n.start)}</div><div><label class="f" for="cE">Kết thúc</label>${timeSel('cE',n.end,true)}</div></div>
      <label class="f" for="cT">Nội dung</label><input class="in" id="cT" value="${esc(n.title)}">`, 'Lưu', async f=>{
        const q=k=>f.querySelector('#'+k).value.trim(), nd=q('cD'), ns=q('cS'), ne=q('cE'), nt=q('cT');
        if(!nt) throw new Error('Nhập nội dung'); if(ne<=ns) throw new Error('Giờ kết thúc phải sau giờ bắt đầu');
        await DB.doc('tasks/'+n.id).update({date:nd, start:ns, end:ne, title:nt, editedBy:myName(), editedAt:nowISO(), carryOk:true, carryBy:myName(), carryAt:nowISO()});
        if(n.carriedFrom) await DB.doc('tasks/'+n.carriedFrom).update({carryDate:nd});
        toast('Đã chỉnh và duyệt, việc đã vào lịch nhân viên'); }); }
  else if(a==='carryOk'){ await DB.doc('tasks/'+id).update({carryOk:true, carryBy:myName(), carryAt:nowISO()}); toast('Đã duyệt, việc đã vào lịch nhân viên'); }
  else if(a==='carryAll'){ for(const n of carriesFrom(S.date).filter(t=>!t.carryOk)) await DB.doc('tasks/'+n.id).update({carryOk:true, carryBy:myName(), carryAt:nowISO()}); toast('Đã duyệt tất cả đề xuất chuyển'); }
  else if(a==='carryUndo'){ await DB.doc('tasks/'+id).update({carryOk:false}); toast('Đã hoàn tác, việc rời khỏi lịch'); }

  toast(`Đã xóa ${n} bản ghi mẫu`);
}

// ================= Kết nối dữ liệu chung =================
render();
(async()=>{
  try{ DB = await window.claude?.use?.('db'); }catch{ DB=null; }
  if(!DB){ S.offline=true; render(); document.getElementById('sync').textContent='Chưa kết nối dữ liệu chung'; return; }
  window.claude.use('assets').then(a=>{ ASSETS=a||null; }).catch(()=>{});
  const got=new Set(); let pending=false;
  const schedule=()=>{ if(pending) return; pending=true; requestAnimationFrame(()=>{ pending=false;
    const ae=document.activeElement; if(ae && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && ae.closest('#app form') && ae.type!=='checkbox') return; render(); }); };
  for(const c of COLS){
    DB.collection(c).onSnapshot(snap=>{
      S[c]=snap.docs.map(d=>({id:d.id, ...d.data()}));
      got.add(c); if(got.size===COLS.length) S.ready=true;
      document.getElementById('sync').innerHTML='<b>●</b> Đồng bộ trực tiếp';
      if(S.ready) schedule();
    }, err=>{ document.getElementById('sync').textContent='Lỗi đồng bộ: '+errMsg(err); });
  }
})();
</script>
